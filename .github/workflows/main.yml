name: Buat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Beri izin Gradle
        run: chmod +x gradlew

      - name: Buat APK
        run: ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Grup-Order-Olumajang-APK
          path: app/build/outputs/apk/debug/*.apk
